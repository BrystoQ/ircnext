<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="background" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="350" y1="330" x2="670" y2="600">
      <stop offset="0" stop-color="#4f7cf7"/>
      <stop offset="1" stop-color="#7c4ff0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Rounded square on Apple's icon grid (824 px body, 100 px margin). -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#background)"/>
  <!-- Speech bubble. -->
  <g fill="#ffffff" filter="url(#shadow)">
    <rect x="236" y="250" width="552" height="430" rx="120"/>
    <path d="M330 640 L290 800 L470 672 Z"/>
  </g>
  <!-- Channel sign. -->
  <g stroke="url(#mark)" stroke-width="58" stroke-linecap="round" fill="none">
    <line x1="458" y1="336" x2="424" y2="594"/>
    <line x1="590" y1="336" x2="556" y2="594"/>
    <line x1="372" y1="418" x2="660" y2="418"/>
    <line x1="358" y1="512" x2="646" y2="512"/>
  </g>
</svg>
