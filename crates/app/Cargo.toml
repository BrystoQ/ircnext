[package]
name = "ircnext"
description = "A modern IRC client written in Rust, with IRCv3 support."
readme = "../../README.md"
keywords = ["irc", "ircv3", "chat", "client", "iced"]
categories = ["network-programming", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4"
directories = "6"
futures = "0.3"
iced = { version = "0.14", features = ["tokio"] }
ircnext-client.workspace = true
ircnext-script.workspace = true
keyring = "4"
notify-rust = "4"
open = "5"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true

[dev-dependencies]
iced_test = "0.14"

[build-dependencies]
embed-resource = "3"
