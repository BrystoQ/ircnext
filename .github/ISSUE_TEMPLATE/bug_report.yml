name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! For a security vulnerability, follow SECURITY.md instead. English or French are both fine.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Join …
        3. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ircnext version
      placeholder: "0.1.0, or the commit hash"
  - type: input
    id: network
    attributes:
      label: IRC network involved
      placeholder: Libera.Chat, OFTC…
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional information
