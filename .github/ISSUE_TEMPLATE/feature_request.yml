name: Feature request
description: A feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Need
      description: What problem would this idea solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you picture it? Does another IRC client already do it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
