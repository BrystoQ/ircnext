[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["BrystoQ"]
repository = "https://github.com/BrystoQ/ircnext"
homepage = "https://github.com/BrystoQ/ircnext"

[workspace.dependencies]
ircnext-proto = { path = "crates/proto" }
ircnext-client = { path = "crates/client" }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Les fonctions `update` et de routage sont des `match` de répartition.
too_many_lines = "allow"
